name: Build and Deploy

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to build and deploy (e.g. v0.1.0)"
        required: true
        type: string

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Resolve image tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="${{ inputs.tag }}"
          fi
          if [ -z "${TAG}" ]; then
            echo "No tag resolved" >&2
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Using tag: ${TAG}"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            durczokj/portfolio:${{ steps.vars.outputs.tag }}

      - name: Render deployment manifest with release tag
        run: |
          set -euo pipefail
          mkdir -p rendered
          sed "s|__IMAGE_TAG__|${{ steps.vars.outputs.tag }}|g" \
            deploy/k8s/deployment.yaml > rendered/deployment.yaml
          echo '--- rendered manifest ---'
          cat rendered/deployment.yaml

      - name: Copy rendered manifest to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "rendered/deployment.yaml"
          target: "/tmp/portfolio"
          strip_components: 1

      - name: Apply manifest and wait for rollout
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -euo pipefail
            sudo k3s kubectl apply -f /tmp/portfolio/deployment.yaml
            sudo k3s kubectl -n dev rollout status deployment/portfolio --timeout=180s
            sudo k3s kubectl -n dev get pods -l app=portfolio -o wide
