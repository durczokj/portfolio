server {
    listen 80;
    server_name durczok.ovh;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name durczok.ovh;

    ssl_certificate /etc/letsencrypt/live/durczok.ovh/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/durczok.ovh/privkey.pem;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Root redirects to portfolio
    location = / {
        return 301 /portfolio/;
    }

    # Portfolio site
    location /portfolio/ {
        alias /usr/share/nginx/html/;
        index index.html;
        try_files $uri $uri/ =404;

        # Cache static assets under /portfolio/
        location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    # Chains app (Docker container on port 8081)
    location /chains/ {
        proxy_pass http://host.docker.internal:8081/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Chains case study (static site)
    location /chains_case_study/ {
        alias /var/www/html/chains_case_study/;
        index index.html;
        try_files $uri $uri/ =404;
    }

    # Vendor Manager app (Docker container on port 8000)
    location /vendor_manager/ {
        proxy_pass http://host.docker.internal:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    error_page 404 /404.html;
}
